{{ define "navbar" }}
<header class="app-navbar">
    <div style="display: flex; align-items: center; gap: 16px;">
        <button id="sidebar-toggle" class="btn btn-secondary btn-icon" title="Toggle Sidebar">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <button id="mobile-menu-toggle" class="btn btn-secondary btn-icon md:hidden">
            <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"/></svg>
        </button>
        <div style="position: relative;">
            <input type="text" class="form-control" placeholder="Search students, faculty, courses..." style="padding-left: 38px; width: 280px; height: 40px; border-radius: 9999px;" data-table-search="main-data-table">
            <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="position: absolute; left: 12px; top: 11px; color: var(--text-muted);"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        </div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px;">
        {{ template "theme-switch" . }}
        {{ template "notification-panel" . }}
        {{ template "profile-dropdown" . }}
    </div>
</header>
{{ end }}
