{{ define "notification-panel" }}
<div style="position: relative;">
    <button id="notif-panel-btn" class="btn btn-secondary btn-icon" style="position: relative;" title="Notifications">
        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
        <span style="position: absolute; top: 6px; right: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--color-danger);"></span>
    </button>

    <div id="notification-panel" class="liquid-glass hidden" style="position: absolute; right: 0; top: 48px; width: 340px; padding: 16px; z-index: 200;">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border-color);">
            <h4 style="font-size: 15px; font-weight: 700;">Notifications</h4>
            <span class="badge badge-primary">3 New</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 10px;">
            <div style="padding: 10px; border-radius: 12px; background: rgba(37, 99, 235, 0.05); border: 1px solid var(--border-color);">
                <p style="font-size: 13px; font-weight: 600; color: var(--text-main);">Absence Threshold Warning</p>
                <p style="font-size: 12px; color: var(--text-muted); margin-top: 2px;">Student John Doe fell below 75% attendance in CS101.</p>
                <span style="font-size: 10px; color: var(--text-light); margin-top: 4px; display: block;">10 mins ago</span>
            </div>
            <div style="padding: 10px; border-radius: 12px; background: rgba(34, 197, 94, 0.05); border: 1px solid var(--border-color);">
                <p style="font-size: 13px; font-weight: 600; color: var(--text-main);">Daily Sync Completed</p>
                <p style="font-size: 12px; color: var(--text-muted); margin-top: 2px;">Faculty biometric sync verified successfully for 450 logs.</p>
                <span style="font-size: 10px; color: var(--text-light); margin-top: 4px; display: block;">1 hour ago</span>
            </div>
        </div>
    </div>
</div>
{{ end }}
