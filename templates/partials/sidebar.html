{{ define "sidebar" }}
<aside class="app-sidebar">
    <div style="padding: 24px; border-bottom: 1px solid var(--border-glass); display: flex; align-items: center; gap: 12px;">
        <div style="width: 40px; height: 40px; border-radius: 12px; background: linear-gradient(135deg, var(--color-primary), var(--color-secondary)); display: flex; align-items: center; justify-content: center; color: white; font-weight: 800; font-size: 20px;">S</div>
        <div class="sidebar-brand-text">
            <h2 style="font-size: 16px; font-weight: 800; line-height: 1.2;">SmartAttend</h2>
            <p style="font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em;">{{ .Role | default "Dashboard" }}</p>
        </div>
    </div>

    <div style="padding: 16px 12px; flex: 1;">
        <div style="font-size: 11px; font-weight: 700; color: var(--text-light); text-transform: uppercase; padding: 8px 12px; margin-bottom: 4px;">Main Menu</div>

        <nav style="display: flex; flex-direction: column; gap: 4px;">
            <a href="/dashboard" class="btn btn-secondary" style="justify-content: flex-start; border: none; background: rgba(37, 99, 235, 0.1); color: var(--color-primary);">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                <span>Dashboard</span>
            </a>

            <a href="#" class="btn btn-secondary" style="justify-content: flex-start; border: none;">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                <span>Users & Roles</span>
            </a>

            <a href="#" class="btn btn-secondary" style="justify-content: flex-start; border: none;">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
                <span>Attendance Records</span>
            </a>

            <a href="#" class="btn btn-secondary" style="justify-content: flex-start; border: none;">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                <span>Analytics & Reports</span>
            </a>

            <a href="#" class="btn btn-secondary" style="justify-content: flex-start; border: none;">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                <span>System Settings</span>
            </a>
        </nav>
    </div>

    <div style="padding: 16px; border-top: 1px solid var(--border-glass);">
        <div style="padding: 12px; border-radius: 12px; background: rgba(37, 99, 235, 0.08); text-align: center;">
            <p style="font-size: 12px; font-weight: 600; color: var(--color-primary);">iOS 26 Liquid Glass</p>
            <p style="font-size: 10px; color: var(--text-muted);">v2.4 Production Ready</p>
        </div>
    </div>
</aside>
{{ end }}
