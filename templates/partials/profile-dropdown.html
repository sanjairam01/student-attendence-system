{{ define "profile-dropdown" }}
<div style="position: relative;">
    <button id="profile-menu-btn" class="btn btn-secondary" style="padding: 6px 12px; border-radius: 9999px;">
        <div style="width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--color-primary), var(--color-secondary)); display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 14px;">
            {{ .UserInitials | default "AD" }}
        </div>
        <span style="font-size: 14px; font-weight: 600; color: var(--text-main);">{{ .UserName | default "Administrator" }}</span>
        <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
    </button>

    <div id="profile-dropdown-menu" class="liquid-glass hidden" style="position: absolute; right: 0; top: 48px; width: 220px; padding: 8px; z-index: 200;">
        <div style="padding: 12px; border-bottom: 1px solid var(--border-color);">
            <p style="font-weight: 700; font-size: 14px; color: var(--text-main);">{{ .UserName | default "System Admin" }}</p>
            <p style="font-size: 12px; color: var(--text-muted);">{{ .UserEmail | default "admin@smartattend.edu" }}</p>
        </div>
        <div style="padding: 4px 0;">
            <a href="#" class="btn btn-secondary" style="width: 100%; justify-content: flex-start; border: none; font-size: 13px;">Profile Settings</a>
            <a href="#" class="btn btn-secondary" style="width: 100%; justify-content: flex-start; border: none; font-size: 13px;">Security & 2FA</a>
            <a href="/login/admin" class="btn btn-secondary" style="width: 100%; justify-content: flex-start; border: none; font-size: 13px; color: var(--color-danger);">Sign Out</a>
        </div>
    </div>
</div>
{{ end }}
