<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Smart Attendance System</title>
  <link rel="stylesheet" href="/static/login/css/liquid-glass.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
  <div class="liquid-orb liquid-orb-1"></div>
  <div class="liquid-orb liquid-orb-2"></div>

  <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle Theme">
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
  </button>

  <div class="glass-card">
    <div class="brand-header">
      <div class="role-badge-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>
      </div>
      <h1 class="brand-title">Reset Password</h1>
      <p class="brand-subtitle">Enter your email to receive an OTP verification code</p>
    </div>

    <!-- Step 1: Request OTP -->
    <form id="forgotForm">
      <div class="input-group">
        <label for="email">Account Email</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          </span>
          <input type="email" id="email" class="input-field" placeholder="your.name@smartattendance.edu" required autocomplete="email">
        </div>
      </div>

      <button type="submit" id="requestOtpBtn" class="btn-submit">
        <span>Send OTP Verification Code</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </form>

    <!-- Step 2: Verify OTP Container (Hidden initially) -->
    <form id="otpForm" style="display: none; margin-top: 20px;">
      <div style="background: rgba(99, 102, 241, 0.15); border: 1px solid rgba(99, 102, 241, 0.3); padding: 12px; border-radius: 12px; font-size: 13px; color: #a5b4fc; margin-bottom: 20px; text-align: center;" id="otpDevNotice">
        OTP code dispatched to email.
      </div>

      <div class="input-group">
        <label for="otpCode">6-Digit OTP Code</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          </span>
          <input type="text" id="otpCode" class="input-field" placeholder="e.g. 849201" maxlength="6" required style="letter-spacing: 0.2em; font-weight: 700;">
        </div>
      </div>

      <button type="submit" id="verifyOtpBtn" class="btn-submit" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%);">
        <span>Verify OTP Code</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
      </button>
    </form>

    <div class="card-footer">
      <a href="/" class="back-home-link">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        <span>Back to Portal Home</span>
      </a>
    </div>
  </div>

  <script src="/static/login/js/auth-app.js"></script>
  <script>
    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const btn = document.getElementById('requestOtpBtn');
      btn.disabled = true;
      btn.innerText = "Dispatching OTP...";

      try {
        const res = await fetch('/api/v1/auth/forgot-password', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ email })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          Swal.fire({
            icon: 'success',
            title: 'OTP Sent',
            text: `OTP generated for ${email}. (Dev Code: ${data.dev_otp})`,
            confirmButtonColor: '#6366f1'
          });
          document.getElementById('forgotForm').style.display = 'none';
          document.getElementById('otpForm').style.display = 'block';
          if (data.dev_otp) {
            document.getElementById('otpDevNotice').innerText = `Development Mode OTP Code: ${data.dev_otp}`;
          }
        } else {
          Swal.fire('Error', data.message || 'Failed to send OTP', 'error');
        }
      } catch (err) {
        Swal.fire('Error', 'Server connection error', 'error');
      } finally {
        btn.disabled = false;
        btn.innerText = "Send OTP Verification Code";
      }
    });

    document.getElementById('otpForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const otp = document.getElementById('otpCode').value.trim();
      
      try {
        const res = await fetch('/api/v1/auth/verify-otp', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ email, otp })
        });
        const data = await res.json();
        if (res.ok && data.success) {
          const resetToken = data.data?.reset_token || 'reset_tok_valid';
          window.location.href = `/reset-password?email=${encodeURIComponent(email)}&token=${encodeURIComponent(resetToken)}`;
        } else {
          Swal.fire('Invalid OTP', data.message || 'Incorrect OTP code entered', 'error');
        }
      } catch (err) {
        Swal.fire('Error', 'Server error', 'error');
      }
    });
  </script>
</body>
</html>
